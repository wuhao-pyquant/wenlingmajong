[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wenling-lan-mobile-foundation"
version = "1.0.0"
description = "LAN-authoritative Wenling Mahjong host and mobile WebView foundation."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wenling-lan-host = "wenling_lan_host.server:main"

[tool.setuptools.packages.find]
where = ["src", "packages/wenling_core"]
